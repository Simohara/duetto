[package]
name = "airbridge-rust"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
cidermill-airplay = "0.1.2"
cpal = "0.16"
mdns-sd = "0.13"
plist = "1"
# Scalar only: one FFT per calibration, and the SIMD paths cost 0.6 MB.
rustfft = { version = "6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[patch.crates-io]
cidermill-airplay = { path = 'vendor/cidermill-airplay' }
